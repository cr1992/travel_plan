name: build manifest

# 网页端直接上传行程后，自动重生成 manifest.json —— 否则首页不会列出新行程
on:
  push:
    branches: [master]
    paths:
      - '**.html'
      - '**.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 生成器的真源在 travel-itinerary-kit，不在本仓复制一份
      - uses: actions/checkout@v4
        with:
          repository: cr1992/travel-itinerary-kit
          path: .kit

      - name: 重新生成 manifest.json
        run: |
          python3 .kit/scripts/build_manifest.py --root . \
            --name "Travel Plan" \
            --url https://github.com/cr1992/travel_plan

      - name: 有变化才提交
        run: |
          if [ -n "$(git status --porcelain manifest.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore: 自动重生成 manifest.json"
            git push
          else
            echo "manifest 无变化"
          fi

<style>

  :root{

  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}

  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;}
  .hero{position:relative;padding:58px 26px 34px;overflow:hidden;background:radial-gradient(120% 80% at 88% 4%, rgba(217,119,87,.16) 0%, rgba(217,119,87,0) 55%),var(--bg);}
  .kicker{font-family:var(--disp);font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:var(--clay-deep);font-weight:600;margin-bottom:16px;}
  .hero h1{font-family:var(--serif);font-weight:700;font-size:2.7rem;line-height:1.16;color:var(--ink);}
  .hero h1 span{color:var(--clay);}
  .rule{width:48px;height:4px;background:var(--clay);border-radius:4px;margin:18px 0 16px;}
  .tag-line{font-size:.98rem;color:var(--ink-2);font-weight:500;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line-2);border-radius:30px;padding:6px 13px;font-size:.84rem;color:var(--ink-2);font-weight:500;box-shadow:0 2px 8px -6px rgba(61,55,45,.4);}
  .chip b{color:var(--ink);font-family:var(--disp);font-weight:600;}
  .chip.lead{background:var(--clay);border-color:var(--clay);color:#fff;}
  .chip.lead b{color:#fff;}
  .info{margin:18px 18px 0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;}
  .info .row{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:.92rem;color:var(--ink-2);}
  .info .row:last-child{border-bottom:0;}
  .info .ic{flex:0 0 24px;font-size:1.1rem;line-height:1.45;}
  .info .row b{color:var(--ink);font-weight:700;}
  .info .tip{background:rgba(217,119,87,.09);}
  .info .tip b{color:var(--clay-deep);}
  .daynav{position:sticky;top:0;z-index:20;display:flex;gap:8px;justify-content:center;padding:12px 14px;margin-top:24px;background:rgba(253,253,252,.9);backdrop-filter:blur(10px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .daynav a{flex:1;text-align:center;text-decoration:none;font-weight:500;font-size:.86rem;color:var(--ink-2);padding:9px 6px;border-radius:11px;border:1px solid var(--line-2);transition:all .25s ease;}
  .daynav a .d{font-family:var(--disp);font-weight:600;font-size:1rem;margin-right:3px;color:var(--clay-deep);}
  .daynav a.on,.daynav a:active{background:var(--clay);color:#fff;border-color:var(--clay);}
  .daynav a.on .d,.daynav a:active .d{color:#fff;}
  .day{padding:34px 22px 8px;scroll-margin-top:64px;}
  .day-head{margin-bottom:22px;}
  .day-num{font-family:var(--disp);font-weight:600;font-size:3.4rem;line-height:.9;color:var(--clay);display:flex;align-items:baseline;gap:10px;}
  .day-num span{font-family:var(--disp);font-size:1rem;color:var(--ink-faint);font-weight:500;letter-spacing:.04em;}
  .day-title{font-family:var(--serif);font-weight:700;font-size:1.34rem;margin-top:10px;color:var(--ink);}
  .day-note{font-size:.92rem;color:var(--ink-soft);margin-top:7px;}
  .entry{display:grid;grid-template-columns:50px 20px 1fr;gap:10px;position:relative;padding-bottom:22px;}
  .entry .time{font-family:var(--disp);font-weight:600;font-size:.94rem;color:var(--clay-deep);text-align:right;padding-top:1px;white-space:nowrap;}
  .entry .mk{position:relative;}
  .entry .mk .dot{width:12px;height:12px;border-radius:50%;background:var(--clay);border:2.5px solid var(--bg);box-shadow:0 0 0 1px var(--clay);margin:6px auto 0;position:relative;z-index:2;}
  .entry .mk::before{content:"";position:absolute;left:50%;top:6px;bottom:-22px;width:2px;transform:translateX(-50%);background:var(--line-2);}
  .entry:last-child .mk::before{display:none;}
  .entry .ttl{font-family:var(--serif);font-weight:500;font-size:1.1rem;color:var(--ink);line-height:1.45;}
  .entry .desc{font-size:.9rem;color:var(--ink-soft);margin-top:3px;}
  .entry .desc b{color:var(--ink-2);font-weight:700;}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:20px;margin-bottom:6px;letter-spacing:.02em;}
  .t-coffee{background:#EBDDC6;color:#8A5A1C;} .t-food{background:#F4DBD0;color:#B14B2C;}
  .t-see{background:#DCE6D6;color:#4C6A42;} .t-shop{background:#E6DFEC;color:#67478F;}
  .t-zoo{background:#E2E8D1;color:#566F24;} .t-air{background:#DCE6EE;color:#33597F;}
  .t-bag{background:#E9E2D5;color:#6A6056;}
  .nav-btn{display:inline-flex;align-items:center;gap:5px;margin-top:10px;text-decoration:none;font-weight:500;font-size:.82rem;color:var(--clay-deep);background:var(--card);border:1px solid var(--line-2);border-radius:30px;padding:7px 14px;transition:all .2s ease;}
  .nav-btn:active{background:var(--clay);color:#fff;border-color:var(--clay);}
  .sub{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 15px;}
  .sub li{list-style:none;font-size:.88rem;color:var(--ink-soft);padding:6px 0 6px 18px;position:relative;border-bottom:1px dashed var(--line);}
  .sub li:last-child{border-bottom:0;}
  .sub li::before{content:"";position:absolute;left:2px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--clay);}
  .sub li b{color:var(--ink);font-weight:700;}
  .opt{margin:2px 0 22px 80px;background:var(--kraft);border:1.5px dashed var(--clay);border-radius:14px;padding:14px 16px;}
  .opt .lbl{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--clay-deep);text-transform:uppercase;margin-bottom:6px;}
  .opt .ot{font-family:var(--serif);font-weight:500;font-size:1rem;color:var(--ink);}
  .opt .ot b{color:var(--clay-deep);}
  .opt .od{font-size:.86rem;color:var(--ink-soft);margin-top:4px;}
  .check{margin:18px 18px 0;background:var(--dark);color:#EDE8DD;border-radius:18px;padding:26px 22px;}
  .check h3{font-family:var(--serif);font-weight:700;font-size:1.24rem;color:#FFFBF2;margin-bottom:4px;}
  .check .cs{font-size:.84rem;color:#B7AE9D;margin-bottom:16px;}
  .check ul{list-style:none;}
  .check li{display:flex;gap:12px;font-size:.92rem;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1);}
  .check li:last-child{border-bottom:0;}
  .check li .n{font-family:var(--disp);font-weight:600;color:var(--clay);flex:0 0 18px;}
  .check li b{color:#fff;font-weight:700;}
  footer{padding:26px 24px 46px;text-align:center;font-size:.78rem;color:var(--ink-faint);line-height:1.6;}
  footer .h{font-family:var(--disp);font-style:italic;color:var(--clay-deep);font-size:.95rem;}
  .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease;}
  .rv.in{opacity:1;transform:none;}
  @media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;}}
</style>
</head>

/* ---------------- renderer (no need to edit below) ---------------- */
const navUrl = m => !m ? null : (/^https?:/.test(m) ? m : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(m));
const navName = m => { try { const u=new URL(navUrl(m)); return decodeURIComponent(u.searchParams.get("query")||"").split(/[,，]/)[0]||"地图"; } catch(e){ return "地图"; } };
const el = (h)=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;};

function render(t){
  const app=document.getElementById("app");
  const chips=t.chips.map(c=>`<span class="chip${c.lead?' lead':''}">${c.text}</span>`).join("");
  const navs=t.days.map(d=>`<a href="#d${d.n}"${d.n===t.days[0].n?' class="on"':''}><span class="d">${d.n}</span>${d.title.split("·").pop().trim()}</a>`).join("");
  const info=t.info.map(r=>`<div class="row${r.tip?' tip':''}"><div class="ic">${r.ic}</div><div>${r.html}</div></div>`).join("");

  const days=t.days.map(d=>{
    const items=d.items.map((it,i)=>{
      const last=(i===d.items.length-1 && (!d.options||!d.options.length));
      const navbtn=it.map?`<a class="nav-btn" href="${navUrl(it.map)}" target="_blank" rel="noopener">📍 导航 ${navName(it.map)}</a>`:"";
      const sub=it.sub?`<ul class="sub">${it.sub.map(s=>`<li>${s}</li>`).join("")}</ul>`:"";
      return `<div class="entry rv"><div class="time">${it.time||""}</div><div class="mk"><div class="dot"></div></div><div class="content">
        ${it.tag?`<span class="tag t-${it.cls||'see'}">${it.tag}</span>`:""}
        <div class="ttl">${it.title}</div>${it.desc?`<div class="desc">${it.desc}</div>`:""}${sub}${navbtn}</div></div>`;
    }).join("");
    const opts=(d.options||[]).map(o=>{
      const nb=o.map?`<a class="nav-btn" href="${navUrl(o.map)}" target="_blank" rel="noopener">📍 导航 ${navName(o.map)}</a>`:"";
      return `<div class="opt rv"><div class="lbl">◆ 可选 · 自由安排</div><div class="ot">${o.title}</div>${o.desc?`<div class="od">${o.desc}</div>`:""}${nb}</div>`;
    }).join("");
    return `<section class="day" id="d${d.n}"><div class="day-head rv"><div class="day-num">${d.n}<span>${d.date||""}</span></div>
      <div class="day-title">${d.title}</div>${d.note?`<div class="day-note">${d.note}</div>`:""}</div><div class="tl">${items}${opts}</div></section>`;
  }).join("");

  const check=`<section class="check rv"><h3>出发前 Checklist</h3><div class="cs">出门前逐项过一遍</div><ul>${
    t.checklist.map((c,i)=>`<li><span class="n">${i+1}</span><div>${c}</div></li>`).join("")}</ul></section>`;

  app.innerHTML=`<header class="hero"><div class="kicker">${t.kicker}</div>
    <h1>${t.h1[0]}<span>${t.h1[1]}</span><br>${t.h1[2]||""}</h1><div class="rule"></div>
    <p class="tag-line">${t.tagline}</p><div class="chips">${chips}</div></header>
    <section class="info rv">${info}</section>
    <nav class="daynav">${navs}</nav>${days}${check}
    <footer><div class="h">${t.footerH}</div>${t.footerNote}</footer>`;

  // reveal-on-scroll
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12,rootMargin:"0px 0px -8% 0px"});
  document.querySelectorAll(".rv").forEach(x=>io.observe(x));
  // active day nav
  const links=[...document.querySelectorAll(".daynav a")];
  const navIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.remove("on"));const a=links.find(l=>l.getAttribute("href")==="#"+e.target.id);if(a)a.classList.add("on");}}),{rootMargin:"-45% 0px -50% 0px"});
  t.days.forEach(d=>{const s=document.getElementById("d"+d.n);if(s)navIO.observe(s);});
}
render(TRIP);
</script>
</body>
</html>
